[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# drmkit's floor (brief M4 D8), which is also the pinned toolchain
# (rust-toolchain.toml) and what Yocto's wrynose ships. It was emblema's 1.85
# until fl-platform-kms brought drmkit in.
rust-version = "1.94.1"
publish = false
# Matches the Flutter Engine and the Dart SDK, whose embedding API this binds.
license = "BSD-3-Clause"

# The engine workspace is not pure Rust, and says so in exactly one place: the
# Dart VM is a C++ runtime, linked from a prebuilt static archive that
# `fl-dart-sys` locates and never builds. Everything else here keeps emblema's
# rule -- no C/C++ toolchain, cmake, or pkg-config at build time.

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
thiserror = "1"
# drmkit (brief M4 D3, D9), with its C libraries as they are: linked from the
# system, never built. Only fl-platform-kms depends on it.
drmkit-input = { version = "0.1.6", default-features = false }
drmkit-core = "0.1.6"
drmkit-display = "0.1.6"
drmkit-modeset = "0.1.6"
drmkit-cursor = "0.1.6"
drmkit-capture = "0.1.6"
drmkit-planes = "0.1.6"
drmkit-session = "0.1.6"
drm = { version = "0.15", default-features = false }
rustix = { version = "1.1", default-features = false, features = ["std", "event", "fs", "time"] }
xkbcommon = { version = "0.9", default-features = false }
trybuild = "1"
# emblema 0.3.4, from the registry. 0.3.0 was the first release with what dart:ui
# needs of it (blend and tile modes numbered as upstream, a shader's local
# transform, per-axis tile modes, a glyph key's subpixel bucket, pipelines
# built ahead of the first frame) and ten-bit scanout under its own fourcc.
# 0.3.1 keeps a pass's multisample and stencil buffers between frames, a
# third of a frame's draw on a VisionFive 2.
# 0.3.2 submits a multisampled pass for a fence, so a display's frame is not
# waited for on the raster thread.
# 0.3.3 builds pipelines through a cache whose bytes are kept between runs.
# 0.3.4 prepares a clip's mask as a canvas draws it, and a variant on request.
emblema = { version = "0.3.4", default-features = false }
emblema-hal = "0.3.4"
emblema-present-drm = "0.3.4"

fl-dart-sys = { path = "crates/fl-dart-sys", version = "0.1.0", default-features = false }
fl-dart-vm = { path = "crates/fl-dart-vm", version = "0.1.0", default-features = false }
fl-dart-ffi = { path = "crates/fl-dart-ffi", version = "0.1.0", default-features = false }
fl-ui = { path = "crates/fl-ui", version = "0.1.0", default-features = false }
fl-shell = { path = "crates/fl-shell", version = "0.1.0", default-features = false }
fl-raster = { path = "crates/fl-raster", version = "0.1.0", default-features = false }
fl-assets = { path = "crates/fl-assets", version = "0.1.0" }
fl-image = { path = "crates/fl-image", version = "0.1.0", default-features = false }
fl-input = { path = "crates/fl-input", version = "0.1.0" }
fl-input-script = { path = "crates/fl-input-script", version = "0.1.0" }
fl-platform-kms = { path = "crates/fl-platform-kms", version = "0.1.0" }
fl-text = { path = "crates/fl-text", version = "0.1.0", default-features = false }

# A release build is what goes on a board, so it is built for its size: the
# whole program optimized as one unit, for size where that costs no speed
# worth the name, and without its symbol table. fl-dart on x86_64 is 10.4 MB
# so, 15.0 MB with cargo's defaults and 12.5 MB of that stripped; a frame of
# text_churn is recorded and drawn in the same time either way. Unwinding
# stays: a panic at the embedder's boundary is caught and reported.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[patch.crates-io]
emblema = { git = "https://github.com/jwinarske/emblema", rev = "c91de9ac054521991da2f8d3fcb36db2c81f5f24" }
emblema-core = { git = "https://github.com/jwinarske/emblema", rev = "c91de9ac054521991da2f8d3fcb36db2c81f5f24" }
emblema-entity = { git = "https://github.com/jwinarske/emblema", rev = "c91de9ac054521991da2f8d3fcb36db2c81f5f24" }
emblema-geometry = { git = "https://github.com/jwinarske/emblema", rev = "c91de9ac054521991da2f8d3fcb36db2c81f5f24" }
emblema-hal = { git = "https://github.com/jwinarske/emblema", rev = "c91de9ac054521991da2f8d3fcb36db2c81f5f24" }
emblema-hal-gles = { git = "https://github.com/jwinarske/emblema", rev = "c91de9ac054521991da2f8d3fcb36db2c81f5f24" }
emblema-hal-vulkan = { git = "https://github.com/jwinarske/emblema", rev = "c91de9ac054521991da2f8d3fcb36db2c81f5f24" }
emblema-present = { git = "https://github.com/jwinarske/emblema", rev = "c91de9ac054521991da2f8d3fcb36db2c81f5f24" }
emblema-present-drm = { git = "https://github.com/jwinarske/emblema", rev = "c91de9ac054521991da2f8d3fcb36db2c81f5f24" }
emblema-present-egl = { git = "https://github.com/jwinarske/emblema", rev = "c91de9ac054521991da2f8d3fcb36db2c81f5f24" }
emblema-present-vk = { git = "https://github.com/jwinarske/emblema", rev = "c91de9ac054521991da2f8d3fcb36db2c81f5f24" }
emblema-renderer = { git = "https://github.com/jwinarske/emblema", rev = "c91de9ac054521991da2f8d3fcb36db2c81f5f24" }
emblema-shaders = { git = "https://github.com/jwinarske/emblema", rev = "c91de9ac054521991da2f8d3fcb36db2c81f5f24" }
emblema-text = { git = "https://github.com/jwinarske/emblema", rev = "c91de9ac054521991da2f8d3fcb36db2c81f5f24" }
