[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# drmkit's floor (brief M4 D8), which is also the pinned toolchain
# (rust-toolchain.toml) and what Yocto's wrynose ships. It was emblema's 1.85
# until fl-platform-kms brought drmkit in.
rust-version = "1.94.1"
publish = false
# Matches the Flutter Engine and the Dart SDK, whose embedding API this binds.
license = "BSD-3-Clause"

# The engine workspace is not pure Rust, and says so in exactly one place: the
# Dart VM is a C++ runtime, linked from a prebuilt static archive that
# `fl-dart-sys` locates and never builds. Everything else here keeps emblema's
# rule -- no C/C++ toolchain, cmake, or pkg-config at build time.

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
thiserror = "1"
# drmkit (brief M4 D3, D9), with its C libraries as they are: linked from the
# system, never built. Only fl-platform-kms depends on it.
drmkit-input = { version = "0.1.5", default-features = false }
drmkit-core = "0.1.5"
drmkit-display = "0.1.5"
drmkit-modeset = "0.1.5"
drmkit-cursor = "0.1.5"
drmkit-capture = "0.1.5"
drmkit-planes = "0.1.5"
drmkit-session = "0.1.5"
drm = { version = "0.15", default-features = false }
rustix = { version = "1.1", default-features = false, features = ["std", "event", "fs", "time"] }
xkbcommon = { version = "0.9", default-features = false }
trybuild = "1"
# Pinned to a commit on emblema's main, not 0.2.0 from crates.io: it carries
# BlendMode and TileMode numbered as upstream (jwinarske/emblema#225) and
# draw_shadow in device pixels (#227), a colored analytic blur
# premultiplied (#234), a shader's local transform (#235), a paint's
# opacity on every shader (#236), a sweep's angle measured as upstream's
# (#237), a tint blended in dart:ui's order (#238), an image's tile mode
# per axis (#239), an atlas faded after its blend (#240), a glyph key's
# subpixel bucket (#241), a blurred convex path's shadow mesh (#242), an
# atlas resident from the start (#243), pipelines built ahead of the
# first frame (#245), a rounded fill tessellated once the pass is
# multisampled (#246) and its shader compiled per variant (#247). Back to
# a registry version once one includes them.
emblema = { git = "https://github.com/jwinarske/emblema", rev = "7d4253a7314172925059587e5c600ddfde3d7483", default-features = false }
emblema-hal = { git = "https://github.com/jwinarske/emblema", rev = "7d4253a7314172925059587e5c600ddfde3d7483" }
emblema-present-drm = { git = "https://github.com/jwinarske/emblema", rev = "7d4253a7314172925059587e5c600ddfde3d7483" }

fl-dart-sys = { path = "crates/fl-dart-sys", version = "0.1.0", default-features = false }
fl-dart-vm = { path = "crates/fl-dart-vm", version = "0.1.0", default-features = false }
fl-dart-ffi = { path = "crates/fl-dart-ffi", version = "0.1.0", default-features = false }
fl-ui = { path = "crates/fl-ui", version = "0.1.0", default-features = false }
fl-shell = { path = "crates/fl-shell", version = "0.1.0", default-features = false }
fl-raster = { path = "crates/fl-raster", version = "0.1.0", default-features = false }
fl-assets = { path = "crates/fl-assets", version = "0.1.0" }
fl-image = { path = "crates/fl-image", version = "0.1.0" }
fl-input = { path = "crates/fl-input", version = "0.1.0" }
fl-input-script = { path = "crates/fl-input-script", version = "0.1.0" }
fl-platform-kms = { path = "crates/fl-platform-kms", version = "0.1.0" }
fl-text = { path = "crates/fl-text", version = "0.1.0" }
