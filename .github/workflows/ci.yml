# The engine workspace's own lanes (brief §11). Three jobs: `no-vm` runs
# everything that FL_DART_SDK_OUT=none admits -- format, clippy in both modes,
# the unit and compile-fail suites, docs under -D warnings -- `l2` links a
# published VM artifact and runs real programs through the real binary, and
# `no-cxx` does the same in a container with no C++ compiler (exit criterion 8).
#
# The L2 lane downloads the pinned stock SDK from dart-archive for `dart
# compile`. Hosted runners reach it directly; the download is checked against
# dart-archive's own .sha256sum and the binary against the pinned version
# string, which is the check that matters: a wrong SDK produces dills the VM
# refuses by hash, and the suite asserts that refusal is a named error, not a
# crash.
#
# The other lanes: cross.yml (aarch64, riscv64 under qemu), soak.yml (leaks,
# soak, valgrind), sanitize.yml (ASan, TSan).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always

jobs:
  no-vm:
    name: no-vm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FL_DART_SDK_OUT: none
    steps:
      - uses: actions/checkout@v4
      # Installs the rust-toolchain.toml pin.
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p fl-dart-cli --no-default-features --features jit --all-targets -- -D warnings
      - run: cargo test -p fl-dart-vm --features aot --lib --test compile_fail
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  l2:
    name: L2 x86_64 ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: aot, flags: "" }
          - { mode: jit, flags: "--no-default-features --features jit" }
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Fetch the prebuilt VM
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/annotate-on-fail.sh cargo xtask fetch-prebuilt --target x86_64-unknown-linux-gnu --mode ${{ matrix.mode }}
      - name: Fetch the pinned stock SDK
        run: |
          base="https://storage.googleapis.com/dart-archive/channels/stable/release/3.13.7/sdk"
          curl -fsSL --retry 3 -O "$base/dartsdk-linux-x64-release.zip"
          curl -fsSL --retry 3 -O "$base/dartsdk-linux-x64-release.zip.sha256sum"
          sha256sum -c dartsdk-linux-x64-release.zip.sha256sum
          unzip -q dartsdk-linux-x64-release.zip
          ./dart-sdk/bin/dart --version 2>&1 | grep -F "3.13.7" \
            || { echo "SDK is not the pinned 3.13.7"; exit 1; }
      - name: L2 suite
        env:
          FL_DART_SDK_BIN: ${{ github.workspace }}/dart-sdk/bin/dart
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/annotate-on-fail.sh cargo test -p fl-dart-cli ${{ matrix.flags }}

  # Exit criterion 8: fl-dart-sys builds, and fl-dart links and runs, with no
  # C++ toolchain present. A bare ubuntu:24.04, not the runner image, which
  # ships g++ and clang; ci/no-cxx.sh installs gcc as rustc's linker driver
  # only, proves no C++ compiler is on PATH, runs the L2 suite, and checks the
  # binary needs no C++ runtime.
  no-cxx:
    name: no C++ toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run without a C++ toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ci/no-cxx.sh

  # Flutter framework apps through dart:ui (docs/m2-dart-ui.md §8). The app
  # is compiled by the pinned Flutter release's own frontend_server and
  # gen_snapshot (tools/flutter-app/build.sh), so the lane needs that
  # release: a clone at its tag, checked against the commit Flutter's
  # release index names, with only the Linux artifacts precached.
  app:
    name: Flutter apps (aot)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: 3.47.8
      FLUTTER_COMMIT: 737ba8f885dc774b53b442759999a312c9461e4e
      FLUTTER_ROOT: ${{ github.workspace }}/../flutter
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.FLUTTER_ROOT }}
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_COMMIT }}
      - name: Pinned Flutter release
        run: |
          if [[ ! -x "$FLUTTER_ROOT/bin/flutter" ]]; then
            git clone -q --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          fi
          head="$(git -C "$FLUTTER_ROOT" rev-parse HEAD)"
          [[ "$head" == "$FLUTTER_COMMIT" ]] || { echo "Flutter is at $head, not $FLUTTER_COMMIT"; exit 1; }
          "$FLUTTER_ROOT/bin/flutter" --disable-analytics >/dev/null
          "$FLUTTER_ROOT/bin/flutter" precache --linux --no-android --no-ios --no-web --no-macos --no-windows --no-fuchsia
          "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart" --version 2>&1 | grep -F "3.13.7" \
            || { echo "Flutter's Dart is not the pinned 3.13.7"; exit 1; }
      - name: Fetch the prebuilt VM
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/annotate-on-fail.sh cargo xtask fetch-prebuilt --target x86_64-unknown-linux-gnu --mode aot
      - name: Apps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/annotate-on-fail.sh cargo test -p fl-dart-cli --test app -- --ignored
      - name: dart:ui unit tests
        run: ci/annotate-on-fail.sh cargo test -p fl-dart-ffi -p fl-ui --features aot --lib
