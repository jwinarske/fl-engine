# Builds the prebuilt Dart VM artifacts (brief §4.2). The only job in this
# repository that compiles C++, and the only one that needs googlesource:
# everything else consumes its output by checksum.
#
# Runs when the pin or the pipeline changes. Publishing a release is a manual
# dispatch with `publish: true`, so a pin bump is built and reviewed before
# anything downstream can fetch it.
name: dart-prebuilt

on:
  pull_request:
    paths:
      - "third_party/dart-prebuilt/*/VERSION"
      - "tools/dart-prebuilt/**"
      - ".github/workflows/dart-prebuilt.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the artifacts as a GitHub release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }} ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, mode: jit }
          - { target: x86_64-unknown-linux-gnu, mode: aot }
          - { target: aarch64-unknown-linux-gnu, mode: aot }
          - { target: riscv64gc-unknown-linux-gnu, mode: aot }
    steps:
      - uses: actions/checkout@v4

      # A Dart checkout with its toolchains and sysroots does not fit in a
      # stock runner's free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Sync dart-lang/sdk at the pin
        run: |
          rev="$(sed -n 's/^revision=//p' third_party/dart-prebuilt/*/VERSION)"
          mkdir -p "$RUNNER_TEMP/dart" && cd "$RUNNER_TEMP/dart"
          gclient config --name sdk --unmanaged https://dart.googlesource.com/sdk.git
          gclient sync --no-history --shallow --revision "sdk@$rev"

      - name: Build
        run: tools/dart-prebuilt/build.sh "$RUNNER_TEMP/dart/sdk" "${{ matrix.target }}" "${{ matrix.mode }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: fl-dart-prebuilt-${{ matrix.target }}-${{ matrix.mode }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(basename "$(dirname third_party/dart-prebuilt/*/VERSION)")"
          cat dist/*.sha256 > dist/SHA256SUMS
          tag="dart-prebuilt-$version"
          notes="Built by dart-prebuilt.yml from $(sed -n 's/^revision=//p' third_party/dart-prebuilt/*/VERSION) at $GITHUB_SHA. Check the SHA256SUMS into third_party/dart-prebuilt/$version/ to make these fetchable."
          # A re-publish for the same pin (a pipeline fix) replaces the assets
          # in place. The checked-in SHA256SUMS is what pins consumers, so a
          # replaced asset is harmless until that file is updated by review.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.xz dist/SHA256SUMS --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" dist/*.tar.xz dist/SHA256SUMS --title "Dart VM prebuilt $version" --notes "$notes"
          fi
