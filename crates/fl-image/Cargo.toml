[package]
name = "fl-image"
description = "Image decoding for fl-engine: headers, frames, the decode thread. No dart:ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A decoder a product has no images for is left out of the build: with none
# of the three, PNG alone is read, and an image in a format left out is
# refused by name. PNG is not a feature: the framework's own assets are PNG.
[features]
default = ["jpeg", "gif", "webp"]
jpeg = ["dep:zune-jpeg"]
gif = ["dep:gif"]
webp = ["dep:image-webp"]

[dependencies]
png = "0.18"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"], optional = true }
gif = { version = "0.14", default-features = false, features = ["std"], optional = true }
image-webp = { version = "0.2", optional = true }

[lints]
workspace = true
