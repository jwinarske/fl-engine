[package]
name = "fl-image"
description = "Image decoding for fl-engine: headers, frames, the decode thread. No dart:ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
png = "0.18"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
gif = { version = "0.14", default-features = false, features = ["std"] }
image-webp = "0.2"

[lints]
workspace = true
