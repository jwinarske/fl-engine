[package]
name = "fl-dart-cli"
description = "`fl-dart run` / `run-aot`: a thin shell over fl-dart-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

build = "build.rs"

[[bin]]
name = "fl-dart"
path = "src/main.rs"

[features]
# AOT is the primary mode (brief §3); `jit` replaces it on a dev host with
# `--no-default-features --features jit`.
default = ["aot", "jpeg", "gif", "webp", "dictionary"]
jit = ["fl-dart-vm/jit", "fl-shell/jit", "fl-raster/jit", "jpeg", "gif", "webp", "dictionary"]
aot = ["fl-dart-vm/aot", "fl-shell/aot", "fl-raster/aot"]
# The image formats decoded besides PNG, each a decoder linked: a product
# with no images in one builds without it (`--no-default-features --features
# aot`, and the ones it has), and an image in a format left out is refused
# by name. `jit` is a dev host's and has them all.
# With `aot`: the VM built without dart:io's secure sockets, and so without
# BoringSSL, 1.6 MB of fl-dart on x86_64: for a product that makes no TLS
# connection from Dart. SecureSocket, SecurityContext and HTTPS from dart:io
# throw ArgumentError, "Secure Sockets unsupported on this platform". Its
# libraries are fetched with `cargo xtask fetch-prebuilt --mode aot-nossl`.
no-secure-sockets = ["fl-dart-vm/no-secure-sockets"]
jpeg = ["fl-ui/jpeg"]
gif = ["fl-ui/gif"]
webp = ["fl-ui/webp"]
# ICU's dictionaries for Thai, Lao, Khmer and Burmese (fl-text's
# `dictionary`), 1.1 MB: those scripts have no spaces, and a line or a word
# breaks inside a run of one where a dictionary word ends. Without it such
# a run is one word, as UAX #14 and #29 leave it, and wraps only where it
# has a space; every other script is as it was. For a product with no text
# in the four.
dictionary = ["fl-ui/dictionary"]
# The KMS platform (brief M4 D9): the XKB keymap a script's key steps are
# resolved against, so `--input` with keys needs it, and the seat and the
# display `--kms` draws to, with the seat's devices and the cursor. It links
# the system's libxkbcommon, libseat, libinput and libudev, which a host or
# a cross sysroot may lack, so it is asked for; the board kit's fl-dart-kms
# is built with it.
kms = ["dep:fl-platform-kms", "fl-raster/scanout"]

[dependencies]
fl-assets = { workspace = true }
fl-dart-vm = { workspace = true }
fl-input = { workspace = true }
fl-input-script = { workspace = true }
fl-platform-kms = { workspace = true, optional = true }
fl-shell = { workspace = true }
fl-ui = { workspace = true }
fl-raster = { workspace = true }

[dev-dependencies]
png = "0.18"

[lints]
workspace = true
