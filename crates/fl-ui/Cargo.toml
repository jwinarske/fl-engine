[package]
name = "fl-ui"
description = "dart:ui's natives for fl-engine: platform configuration, painting, compositing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The image formats decoded besides PNG (fl-image's features) and the
# dictionaries Thai, Lao, Khmer and Burmese break by (fl-text's), on unless
# a build asks for fewer.
default = ["jpeg", "gif", "webp", "dictionary"]
jit = ["fl-dart-ffi/jit"]
aot = ["fl-dart-ffi/aot"]
jpeg = ["fl-image/jpeg"]
gif = ["fl-image/gif"]
webp = ["fl-image/webp"]
dictionary = ["fl-text/dictionary"]

[dependencies]
fl-assets = { workspace = true }
fl-image = { workspace = true }
fl-input = { workspace = true }
fl-text = { workspace = true }
fl-dart-ffi = { workspace = true }
i_overlay = { workspace = true }
# A dma-buf texture's descriptors: duplicated, identified and waited on.
rustix = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }

[lints]
workspace = true
