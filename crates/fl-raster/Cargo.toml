[package]
name = "fl-raster"
description = "fl-engine's raster side: dart:ui scenes drawn by emblema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
jit = ["fl-ui/jit"]
aot = ["fl-ui/aot"]
# A display as the target (brief M4 D9): emblema's scanout presentation,
# over an output the platform gives. Pure Rust, as emblema's `drm` is.
# With emblema's `gbm`: a ring whose buffers the display's own card allocates,
# for a display controller that takes no buffer of the GPU's (a VisionFive
# 2's). libgbm is opened when that ring is asked for, not linked.
scanout = ["emblema/drm", "dep:emblema-hal", "dep:emblema-present-drm"]

[dependencies]
fl-ui = { workspace = true }
# Vulkan first (docs/m2-dart-ui.md D4). No window-system feature: offscreen,
# and a display through `scanout`. The pin is the workspace's.
emblema = { workspace = true, features = ["vulkan"] }
# The format types of an output's trait, which the facade does not name.
emblema-hal = { workspace = true, optional = true }
# The facade's `drm` is this crate; named for its `gbm` feature alone, which
# the facade does not pass on.
emblema-present-drm = { workspace = true, optional = true, features = ["gbm"] }
png = "0.18"
# Glyph coverage (brief M3 D2): the outline and its hinting from skrifa,
# FreeType's light auto-hinter as Skia asks of it for Impeller's text, and
# its coverage from swash's rasterizer (zeno); swash's scaler for the
# outlines of text drawn as paths, unhinted.
swash = { version = "0.2", default-features = false, features = ["scale", "render", "std"] }
skrifa = "0.49"
fl-text = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }

[lints]
workspace = true
