[package]
name = "fl-raster"
description = "fl-engine's raster side: dart:ui scenes drawn by emblema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
jit = ["fl-ui/jit"]
aot = ["fl-ui/aot"]
# A display as the target (brief M4 D9): emblema's scanout presentation,
# over an output the platform gives. Pure Rust, as emblema's `drm` is.
scanout = ["emblema/drm", "dep:emblema-hal"]

[dependencies]
fl-ui = { workspace = true }
# Vulkan first (docs/m2-dart-ui.md D4). No window-system feature: offscreen,
# and a display through `scanout`. The pin is the workspace's.
emblema = { workspace = true, features = ["vulkan"] }
# The format types of an output's trait, which the facade does not name.
emblema-hal = { workspace = true, optional = true }
png = "0.18"
# Glyph coverage (brief M3 D2), on skrifa, as emblema's own example names.
swash = { version = "0.2", default-features = false, features = ["scale", "render", "std"] }
fl-text = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }

[lints]
workspace = true
